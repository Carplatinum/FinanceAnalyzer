[project]
name = "financeanalyzer"
version = "0.1.0"
description = "money, cash, bank"
authors = [
    {name = "ANTAQ",email = "mymillions@ya.ru"}
]
license = {text = "Platinum"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=2.2.3,<3.0.0)",
    "flask (>=3.1.0,<4.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "black (>=25.1.0,<26.0.0)",
    "flake8 (>=7.2.0,<8.0.0)",
    "mypy (>=1.15.0,<2.0.0)",
    "pytest (>=8.3.5,<9.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"

[tool.isort]
profile = "black"
line_length = 119

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
    | venv
)/
'''

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
